##	Uncomment for 350mm build
gantry_corners:
	-60,-10
	410,420
##	Probe points
points:
    50,25
	50,275
	300,275
	300,25

#--------------------------------------------------------------------
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.005
max_adjust: 10

