[gcode_shell_command backup_cfg]
command: /usr/bin/bash /home/pi/printer_data/config/autocommit.sh
timeout: 30
verbose: True

[gcode_macro BACKUP_CFG]
description: Backs up config directory to GitHub. Optional: MSG=<commit message> TAGS=<space-separated tag name(s)>
gcode:
    {% set msg = params.MSG|default('') %}
    {% set tags = params.TAGS|default('') %}
    RUN_SHELL_COMMAND CMD=backup_cfg PARAMS='"{msg}" "{tags}"'
